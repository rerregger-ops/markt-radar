<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f19" />
  <link rel="manifest" href='data:application/manifest+json,{"name":"Markt-Radar","short_name":"Markt-Radar","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0b0f19"}' />
  <title>Markt-Radar · KI-Stimmungsindex</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 18px 16px 36px;
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .title-group h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .title-group p { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }
    .tabs {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #09111e; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sector-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
    }
    .sector-pill.hidden-series { opacity: 0.4; text-decoration: line-through; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .score-badge { font-weight: 700; font-variant-numeric: tabular-nums; }
    .pos { color: #34d399; }
    .neg { color: #f87171; }
    .neu { color: #94a3b8; }
    .chart-wrapper { position: relative; height: 290px; width: 100%; }
    .scale-hint {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .news-header h2 { font-size: 1rem; font-weight: 600; }
    .news-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 720px) { .news-grid { grid-template-columns: repeat(3, 1fr); } }
    .news-item {
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      text-decoration: none;
      color: inherit;
    }
    .news-item:hover { border-color: var(--accent); }
    .news-tag {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .news-title { font-size: 0.9rem; font-weight: 600; line-height: 1.35; }
    .news-reason { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
    .news-link { font-size: 0.75rem; color: var(--accent); font-weight: 600; margin-top: 4px; }
    .disclaimer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Markt-Radar</h1>
      <p id="lastUpdated">Lade Marktdaten…</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-period="daily">Täglich</button>
      <button class="tab-btn" data-period="weekly">Wöchentlich</button>
      <button class="tab-btn" data-period="monthly">Monatlich</button>
    </div>
  </header>

  <section class="card">
    <div class="legend-bar" id="legendBar"></div>
    <div class="chart-wrapper">
      <canvas id="radarChart"></canvas>
    </div>
    <div class="scale-hint">
      <span>-5,0 = Stark bärisch</span>
      <span>0,0 = Neutral</span>
      <span>+5,0 = Stark bullisch</span>
    </div>
  </section>

  <section class="card">
    <div class="news-header">
      <h2>Top 3 Markt-Treiber</h2>
      <span id="newsPeriodLabel" style="font-size:0.78rem;color:var(--muted);">Aktuell</span>
    </div>
    <div class="news-grid" id="newsGrid"></div>
  </section>

  <p class="disclaimer">
    Automatisch generierte KI-Auswertung öffentlicher Finanzschlagzeilen. Keine Anlageberatung.
  </p>

  <script>
    const SECTORS = [
      { key: "tech", label: "Tech", color: "#38bdf8" },
      { key: "rohstoffe", label: "Rohstoffe", color: "#f59e0b" },
      { key: "waehrungen", label: "Währungen", color: "#10b981" },
      { key: "krypto", label: "Krypto", color: "#a855f7" },
      { key: "industrie", label: "Industrie", color: "#ec4899" }
    ];

    let allDays = [];
    let currentPeriod = "daily";
    let hiddenSectors = new Set();
    let chart;

    function formatScore(val) {
      if (val === undefined || val === null || isNaN(val)) return "0,0";
      const sign = val > 0 ? "+" : "";
      return sign + val.toFixed(1).replace(".", ",");
    }

    function scoreClass(val) {
      if (val > 0.3) return "pos";
      if (val < -0.3) return "neg";
      return "neu";
    }

    function formatDateDE(iso) {
      const [y, m, d] = iso.split("-");
      return `${d}.${m}.`;
    }

    function aggregateData(period) {
      if (!allDays.length) return { labels: [], series: {}, news: [], labelText: "" };

      if (period === "daily") {
        const slice = allDays.slice(-14);
        const series = {};
        SECTORS.forEach(s => series[s.key] = slice.map(d => d.scores[s.key]));
        const latestDay = slice[slice.length - 1];
        return {
          labels: slice.map(d => formatDateDE(d.date)),
          series,
          news: latestDay.top_news || [],
          labelText: `Stand ${formatDateDE(latestDay.date)}`
        };
      }

      if (period === "weekly") {
        const groups = {};
        allDays.forEach(d => {
          const dt = new Date(d.date);
          const onejan = new Date(dt.getFullYear(), 0, 1);
          const kw = Math.ceil((((dt - onejan) / 86400000) + onejan.getDay() + 1) / 7);
          const key = `${dt.getFullYear()}-KW ${kw}`;
          if (!groups[key]) groups[key] = [];
          groups[key].push(d);
        });
        const keys = Object.keys(groups).slice(-12);
        const series = {};
        SECTORS.forEach(s => {
          series[s.key] = keys.map(k => {
            const arr = groups[k];
            const avg = arr.reduce((sum, item) => sum + item.scores[s.key], 0) / arr.length;
            return Number(avg.toFixed(2));
          });
        });
        const lastGroup = groups[keys[keys.length - 1]];
        return {
          labels: keys.map(k => k.split("-")[1]),
          series,
          news: lastGroup[lastGroup.length - 1].top_news || [],
          labelText: "Wochendurchschnitt"
        };
      }

      if (period === "monthly") {
        const monthNames = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
        const groups = {};
        allDays.forEach(d => {
          const [y, m] = d.date.split("-");
          const key = `${y}-${m}`;
          if (!groups[key]) groups[key] = [];
          groups[key].push(d);
        });
        const keys = Object.keys(groups).slice(-12);
        const series = {};
        SECTORS.forEach(s => {
          series[s.key] = keys.map(k => {
            const arr = groups[k];
            const avg = arr.reduce((sum, item) => sum + item.scores[s.key], 0) / arr.length;
            return Number(avg.toFixed(2));
          });
        });
        const lastGroup = groups[keys[keys.length - 1]];
        return {
          labels: keys.map(k => monthNames[parseInt(k.split("-")[1], 10) - 1]),
          series,
          news: lastGroup[lastGroup.length - 1].top_news || [],
          labelText: "Monatsdurchschnitt"
        };
      }
    }

    function renderLegend(series) {
      const bar = document.getElementById("legendBar");
      bar.innerHTML = "";
      SECTORS.forEach(sec => {
        const vals = series[sec.key] || [];
        const latest = vals.length ? vals[vals.length - 1] : 0;
        const pill = document.createElement("button");
        pill.className = "sector-pill" + (hiddenSectors.has(sec.key) ? " hidden-series" : "");
        pill.innerHTML = `
          <span class="dot" style="background:${sec.color}"></span>
          <span>${sec.label}</span>
          <span class="score-badge ${scoreClass(latest)}">${formatScore(latest)}</span>
        `;
        pill.onclick = () => {
          if (hiddenSectors.has(sec.key)) hiddenSectors.delete(sec.key);
          else hiddenSectors.add(sec.key);
          updateView();
        };
        bar.appendChild(pill);
      });
    }

    function renderNews(newsList, labelText) {
      document.getElementById("newsPeriodLabel").textContent = labelText;
      const grid = document.getElementById("newsGrid");
      grid.innerHTML = "";
      newsList.forEach(item => {
        const secObj = SECTORS.find(s => s.label.toLowerCase() === (item.sector || "").toLowerCase()) || SECTORS[0];
        const card = document.createElement("a");
        card.className = "news-item";
        card.href = item.url || "#";
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.innerHTML = `
          <div>
            <span class="news-tag" style="background:${secObj.color}22;color:${secObj.color}">${item.sector}</span>
            <div class="news-title" style="margin-top:8px;">${item.title}</div>
            <div class="news-reason" style="margin-top:6px;">${item.reason}</div>
          </div>
          <div class="news-link">Originalartikel öffnen →</div>
        `;
        grid.appendChild(card);
      });
    }

    function updateView() {
      const view = aggregateData(currentPeriod);
      renderLegend(view.series);
      renderNews(view.news, view.labelText);

      const datasets = SECTORS.map(sec => ({
        label: sec.label,
        data: view.series[sec.key] || [],
        borderColor: sec.color,
        backgroundColor: sec.color,
        borderWidth: 2.5,
        pointRadius: 4,
        pointHoverRadius: 6,
        tension: 0.35,
        hidden: hiddenSectors.has(sec.key)
      }));

      if (chart) chart.destroy();
      const ctx = document.getElementById("radarChart").getContext("2d");
      chart = new Chart(ctx, {
        type: "line",
        data: { labels: view.labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: false } },
          scales: {
            y: {
              min: -5,
              max: 5,
              ticks: { stepSize: 2.5, color: "#94a3b8" },
              grid: {
                color: (c) => c.tick.value === 0 ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.06)",
                lineWidth: (c) => c.tick.value === 0 ? 1.5 : 1
              }
            },
            x: {
              ticks: { color: "#94a3b8" },
              grid: { display: false }
            }
          }
        }
      });
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPeriod = btn.dataset.period;
        updateView();
      };
    });

    async function init() {
      try {
        const res = await fetch("data.json?t=" + Date.now());
        if (!res.ok) throw new Error("Noch keine data.json vorhanden");
        const json = await res.json();
        allDays = json.days || [];
        if (allDays.length) {
          const last = allDays[allDays.length - 1].date;
          document.getElementById("lastUpdated").textContent = `Letztes KI-Update: ${last} · 5 Sparten im Vergleich`;
          updateView();
        }
      } catch (e) {
        document.getElementById("lastUpdated").textContent = "Warte auf ersten Workflow-Lauf (data.json)…";
      }
    }

    init();
  </script>
</body>
</html>
